[project]
name = "metatube"
version = "0.1.0"
description = "A selfhosted python web app to download music videos from YouTube and add metadata from a specified metadata provider on the downloaded file."
readme = "README.md"
authors = [
    { name = "JVT038", email = "jvt038@pm.me" }
]
requires-python = ">=3.14"
dependencies = [
    "deezer-python>=7.4.0",
    "flask>=3.1.3",
    "flask-migrate>=4.1.0",
    "flask-socketio>=5.6.1",
    "flask-sqlalchemy>=3.1.1",
    "gevent>=26.8.0",
    "gevent-websocket>=0.10.1",
    "lyricsgenius>=3.12.2",
    "musicbrainzngs>=0.7.1",
    "mutagen>=1.48.1",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.3",
    "python-magic>=0.4.27",
    "python-magic-bin>=0.4.14 ; sys_platform == 'win32'",
    "requests>=2.34.2",
    "sponsorblock-py>=1.0.0",
    "spotipy>=2.26.0",
    "urllib3>=2.7.0",
    "youtube-search>=2.2.0",
    "youtube-search-python>=1.6.6",
    "yt-dlp>=2026.7.4",
]

[project.scripts]
metatube = "metatube:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "ty>=0.0.72",
]
